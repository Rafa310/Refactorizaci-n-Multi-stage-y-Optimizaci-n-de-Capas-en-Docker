services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      INTERNAL_API_URL: http://nginx
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET:?Define DEMO_SESSION_SECRET in .env}
      BASE_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: KodigoDocker
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY in .env}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER:?Define MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - backend
    restart: unless-stopped

  db:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    image: tienda-demo-mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 25s
    restart: unless-stopped

volumes:
  mysql_data:
